active_provider: openai

providers:
  openai:
    enabled: true
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
    temperature: 0.4
    max_output_tokens: 1200

  tinyllama:
    enabled: false
    model_path: models/tinyllama
    max_new_tokens: 512
    temperature: 0.7
    top_p: 0.9
    device: auto

agent_model_map:
  teacher: openai
  architect_lens: openai
  assessor: openai
  evaluator_refiner: openai

fallbacks:
  teacher:
    - openai
  architect_lens:
    - openai
  assessor:
    - openai
  evaluator_refiner:
    - openai

